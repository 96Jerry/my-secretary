# my-secretary 배포용 GitHub Actions self-hosted runner
# 최초 1회: RUNNER_TOKEN=<등록 토큰> docker compose up -d  (이후엔 docker compose up -d)
services:
  runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    environment:
      # 저장소 Settings → Actions → Runners → New self-hosted runner의 --token 값. 첫 등록 때만 쓰인다
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/96Jerry/my-secretary
      RUNNER_NAME: mac-mini
      # 기본 라벨(self-hosted, Linux, ARM64)에 더해 이 앱 전용 라벨을 붙인다
      LABELS: my-secretary
      # 등록 토큰은 1시간이면 만료되므로, 첫 등록 결과를 볼륨에 남겨 재시작 때 재등록하지 않는다
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-data
      # 컨테이너가 멈출 때 등록을 해제하면 남겨 둔 등록 정보가 무효가 된다
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
    volumes:
      - runner-data:/runner-data
      # 호스트 도커를 그대로 쓴다. 이 컨테이너는 도커 전체 권한을 가지므로
      # 워크플로는 push 트리거만 쓰고 fork PR이 닿지 않게 유지할 것
      - /var/run/docker.sock:/var/run/docker.sock
      # 앱 배포 경로를 호스트와 같은 경로로 마운트해야 compose가 같은 프로젝트로 인식한다
      - /Users/paradise/deploy/my-secretary:/Users/paradise/deploy/my-secretary

volumes:
  runner-data:
