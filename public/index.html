<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹툰 찜 순위</title>
<link rel="stylesheet" href="/assets/styles.css">
<script type="module" src="/assets/js/main.js"></script>
</head>
<body>
<main>
  <header>
    <div>
      <h1>네이버 웹툰 찜 순위</h1>
      <div class="meta" id="meta">불러오는 중…</div>
    </div>
    <button class="primary" id="refresh">지금 수집</button>
  </header>
  <div id="status"></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-view="ranking" aria-selected="true">순위</button>
    <button role="tab" data-view="movers" aria-selected="false">급상승</button>
    <button role="tab" data-view="logs" aria-selected="false">내 기록</button>
  </div>

  <div class="controls">
    <input type="search" id="search" placeholder="제목·작가 검색">
    <button id="sort" title="정렬 방향 바꾸기">찜 많은 순 ↓</button>
    <select id="mine" aria-label="내 기록 필터" hidden>
      <option value="all">내 기록: 전체</option>
      <option value="hide">본 작품 빼기</option>
      <option value="only">본 작품만</option>
    </select>
  </div>

  <div id="moverControls" hidden>
    <div class="controls period">
      <span>기간</span>
      <span class="chips inline" id="presets"></span>
      <select id="from" aria-label="시작일"></select> → <select id="to" aria-label="종료일"></select>
    </div>
    <div class="chips" id="modes"></div>
    <div class="hint" id="modeHint"></div>
  </div>

  <div id="logControls" hidden>
    <div class="actions toolbar">
      <button class="primary" id="addLog">+ 기록 추가</button>
      <button id="bulkLog">목록 붙여넣기</button>
      <select id="logSort" aria-label="정렬">
        <option value="stale">오래 안 본 순</option>
        <option value="recent">최근 본 순</option>
        <option value="unread">밀린 회차 많은 순</option>
        <option value="title">제목순</option>
      </select>
    </div>
    <div id="logPanel"></div>
    <div class="chips" id="logStatuses"></div>
  </div>

  <div class="chips" id="genres"></div>
  <ol id="list"></ol>
  <datalist id="naverTitles"></datalist>
</main>
</body>
</html>
