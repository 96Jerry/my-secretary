<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹툰 찜 순위</title>
<style>
  :root {
    --bg: #f7f7f8; --surface: #fff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e5e5ea; --accent: #00c73c; --accent-text: #fff; --chip: #efeff2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #1c1c1f; --text: #f2f2f4; --muted: #9a9aa0;
      --line: #2c2c31; --accent: #00c73c; --accent-text: #0b0b0c; --chip: #26262b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--text); padding: 6px 12px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .55; cursor: progress; }
  .controls { display: flex; gap: 8px; margin: 20px 0 12px; }
  input[type=search] {
    flex: 1; min-width: 0; font: inherit; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  .genres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .genres button { background: var(--chip); border-color: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .genres button[aria-pressed=true] { background: var(--text); color: var(--bg); }
  .genres small { color: inherit; opacity: .6; margin-left: 4px; }
  ol { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li { display: grid; grid-template-columns: 3em 1fr auto; align-items: baseline; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  li a { color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li a:hover { text-decoration: underline; }
  .genre { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .count { font-variant-numeric: tabular-nums; font-weight: 600; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  #status { min-height: 1.5em; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>네이버 웹툰 찜 순위</h1>
      <div class="meta" id="meta">불러오는 중…</div>
    </div>
    <button class="primary" id="refresh">지금 수집</button>
  </header>
  <div id="status"></div>

  <div class="controls">
    <input type="search" id="search" placeholder="제목 검색">
    <button id="sort" title="정렬 방향 바꾸기">찜 많은 순 ↓</button>
  </div>
  <div class="genres" id="genres"></div>
  <ol id="list"></ol>
</main>

<script>
  // 전체 목록을 한 번 받아 장르·검색·정렬은 브라우저에서 처리한다.
  // 순위(rank)는 서버가 매긴 전체 순위를 그대로 보여준다.
  const state = { data: null, genre: '', query: '', desc: true };
  const $ = (id) => document.getElementById(id);
  const fmt = new Intl.NumberFormat('ko-KR');

  async function load() {
    const res = await fetch('/webtoons/ranking');
    if (!res.ok) throw new Error(`조회 실패 (HTTP ${res.status})`);
    state.data = await res.json();
    render();
  }

  function render() {
    const { snapshotDate, genres, items } = state.data;
    $('meta').textContent = snapshotDate
      ? `${snapshotDate} 기준 · ${fmt.format(items.length)}개 작품`
      : '아직 수집된 데이터가 없습니다. "지금 수집"을 눌러 주세요.';

    const chips = [{ code: '', name: '전체', count: items.length }, ...genres];
    $('genres').replaceChildren(...chips.map((g) => {
      const b = document.createElement('button');
      b.setAttribute('aria-pressed', String(g.code === state.genre));
      b.append(g.name);
      const small = document.createElement('small');
      small.textContent = g.count;
      b.append(small);
      b.onclick = () => { state.genre = g.code; render(); };
      return b;
    }));

    const q = state.query.trim().toLowerCase();
    // 장르 안에서의 순위를 보여주기 위해 필터 후 다시 번호를 매긴다
    let rows = items
      .filter((w) => !state.genre || w.genreCode === state.genre)
      .map((w, i) => ({ ...w, rank: i + 1 }))
      .filter((w) => !q || w.titleName.toLowerCase().includes(q));
    if (!state.desc) rows = rows.reverse();

    $('sort').textContent = state.desc ? '찜 많은 순 ↓' : '찜 적은 순 ↑';
    if (rows.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = snapshotDate ? '조건에 맞는 작품이 없습니다.' : '데이터 없음';
      $('list').replaceChildren(li);
      return;
    }
    $('list').replaceChildren(...rows.map((w) => {
      const li = document.createElement('li');
      const rank = document.createElement('span');
      rank.className = 'rank';
      rank.textContent = w.rank;
      const a = document.createElement('a');
      a.href = `https://comic.naver.com/webtoon/list?titleId=${w.titleId}`;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = w.titleName;
      if (!state.genre) {
        const g = document.createElement('span');
        g.className = 'genre';
        g.textContent = w.genreName;
        a.append(g);
      }
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = fmt.format(w.favoriteCount);
      li.append(rank, a, count);
      return li;
    }));
  }

  $('refresh').onclick = async () => {
    const btn = $('refresh');
    btn.disabled = true;
    btn.textContent = '수집 중…';
    $('status').textContent = '네이버에서 800여 개 작품을 조회하고 있습니다 (30초 안팎).';
    try {
      const res = await fetch('/webtoons/ranking/refresh', { method: 'POST' });
      if (!res.ok) throw new Error(`수집 실패 (HTTP ${res.status})`);
      const r = await res.json();
      $('status').textContent =
        `${fmt.format(r.saved)}개 저장` + (r.failed ? `, 실패 ${r.failed}개` : '') +
        ` · ${(r.elapsedMs / 1000).toFixed(1)}초`;
      await load();
    } catch (e) {
      $('status').textContent = e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '지금 수집';
    }
  };

  $('search').oninput = (e) => { state.query = e.target.value; render(); };
  $('sort').onclick = () => { state.desc = !state.desc; render(); };

  load().catch((e) => { $('meta').textContent = e.message; });
</script>
</body>
</html>
