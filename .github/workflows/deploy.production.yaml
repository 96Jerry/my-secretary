name: Deploy to Mac mini

on:
  push:
    branches: [main]

# 동시 배포 방지 (이전 배포가 끝날 때까지 대기)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/96jerry/my-secretary

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 환경변수는 test/jest.setup.ts가 더미 값으로 채운다
      - name: 테스트
        run: pnpm test

  build:
    needs: test
    # 맥미니(애플 실리콘)와 같은 arm64에서 빌드해 에뮬레이션 없이 이미지를 만든다
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest는 배포용, 커밋 해시 태그는 롤백용
      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # 맥미니 도커 위의 러너 컨테이너(deploy/runner). 공개 저장소라 push 이벤트에서만 실행되도록 트리거를 유지할 것
    runs-on: [self-hosted, Linux, ARM64, my-secretary]
    # 공개 이미지라 로그인 없이 pull하므로 토큰 권한이 필요 없다
    permissions: {}
    steps:
      # 체크아웃 없이 맥미니의 고정 경로(compose 파일 + .env)에서 실행
      - name: 새 이미지로 교체
        working-directory: /Users/paradise/deploy/my-secretary
        run: |
          docker compose pull app
          docker compose up -d
          docker image prune -f
