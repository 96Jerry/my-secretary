services:
  app:
    # 배포는 GHCR 이미지를 받아 쓰고, 로컬에서는 docker compose build로 직접 빌드한다
    # 롤백: IMAGE_TAG=<커밋 해시> docker compose up -d
    image: ghcr.io/96jerry/my-secretary:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    # 운영 기준. 개발은 3000을 쓰도록 3100으로 비켜 두고, 맥미니 밖에서는 접근하지 못하게 한다
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # 개발 DB가 5432를 쓰므로 운영은 5433으로 비켜 둔다
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
