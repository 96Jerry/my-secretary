services:
  app:
    # 배포는 GHCR 이미지를 받아 쓰고, 로컬에서는 docker compose build로 직접 빌드한다
    # 롤백: IMAGE_TAG=<커밋 해시> docker compose up -d
    image: ghcr.io/96jerry/my-secretary:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    # 기본 포트는 운영이 쓴다(개발은 3001). 맥미니 밖에서는 tailscale serve로만 접근한다
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # 기본 포트는 운영이 쓴다(개발 DB는 5433)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
